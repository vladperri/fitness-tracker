<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16794A">
<meta name="color-scheme" content="light">
<title>Трекери</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Трекери">
<meta property="og:title" content="Трекери">
<meta property="og:description" content="Щоденні трекери тренувань">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1ECE2; --card:#FFFFFF; --ink:#17160F; --muted:#75736A;
    --line:rgba(23,22,15,.09);
    --v-accent:#16794A; --v-deep:#0F5A37; --v-soft:#E6F1EA;
    --l-accent:#D4788F; --l-deep:#B85570; --l-soft:#FBE4EA;
    --shadow:0 1px 2px rgba(23,22,15,.04), 0 8px 24px rgba(23,22,15,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink)}
  body{
    font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    display:flex;flex-direction:column;justify-content:center;
    padding:40px 16px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%;max-width:440px;margin:0 auto}

  .eyebrow{
    font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;
  }
  h1{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800;font-size:clamp(32px,9vw,42px);line-height:1.05;
    letter-spacing:-.02em;margin-bottom:28px;
  }

  .card{
    display:block;text-decoration:none;color:inherit;
    background:var(--card);border-radius:22px;padding:22px;
    box-shadow:var(--shadow);border:1px solid var(--line);
    margin-bottom:14px;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:active{transform:scale(.985)}
  @media (hover:hover){
    .card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(23,22,15,.05), 0 14px 32px rgba(23,22,15,.10)}
  }

  .row{display:flex;align-items:center;gap:15px}
  .ico{
    width:52px;height:52px;border-radius:16px;flex:none;
    display:grid;place-items:center;font-size:24px;
  }
  .meta{flex:1;min-width:0}
  .name{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:700;font-size:20px;letter-spacing:-.01em;line-height:1.2;
  }
  .sub{font-size:14px;color:var(--muted);margin-top:3px;font-weight:500}
  .arrow{font-size:22px;line-height:1;flex:none;font-weight:600}

  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
  .tag{
    font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;
    letter-spacing:.01em;
  }

  .c-vlad .ico{background:var(--v-soft);color:var(--v-deep)}
  .c-vlad .arrow{color:var(--v-accent)}
  .c-vlad .tag{background:var(--v-soft);color:var(--v-deep)}

  .c-lera .ico{background:var(--l-soft);color:var(--l-deep)}
  .c-lera .arrow{color:var(--l-accent)}
  .c-lera .tag{background:var(--l-soft);color:var(--l-deep)}

  .foot{
    text-align:center;font-size:12px;color:var(--muted);
    margin-top:22px;font-weight:500;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Тренування</div>
    <h1>Обери трекер</h1>

    <a class="card c-vlad" href="vlad/">
      <div class="row">
        <div class="ico">🏋️</div>
        <div class="meta">
          <div class="name">Влад</div>
          <div class="sub">Push · Pull · Legs · через день</div>
        </div>
        <div class="arrow">›</div>
      </div>
      <div class="tags">
        <span class="tag">Набір маси</span>
        <span class="tag">3 тренування</span>
        <span class="tag">Прес 8 хв</span>
      </div>
    </a>

    <a class="card c-lera" href="valeria/">
      <div class="row">
        <div class="ico">🍑</div>
        <div class="meta">
          <div class="name">Валерія</div>
          <div class="sub">Сідниці · Верх · через день</div>
        </div>
        <div class="arrow">›</div>
      </div>
      <div class="tags">
        <span class="tag">Тонус</span>
        <span class="tag">4 тренування</span>
        <span class="tag">Низ тіла</span>
      </div>
    </a>

    <div class="foot">Дані зберігаються окремо для кожного трекера</div>
  </div>
</body>
</html>
