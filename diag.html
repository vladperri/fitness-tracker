<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Авто-діагностика</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,system-ui,sans-serif;background:#F2F2F5;color:#111;padding:18px;max-width:460px;margin:0 auto;line-height:1.45}
  h1{font-size:21px;margin-bottom:14px}
  .r{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid rgba(0,0,0,.07)}
  .r .k{font-size:14.5px;font-weight:600}
  .r .v{font-size:14.5px;font-weight:800;white-space:nowrap}
  .yes{color:#1B7F3B}.no{color:#C21F1F}.wait{color:#9A6B00}
  .final{border-radius:16px;padding:16px;margin:16px 0;font-size:15px;font-weight:600;line-height:1.5}
  .f-ios{background:#FDE7E7;color:#8B1414}
  .f-code{background:#FFF3DC;color:#7A5300}
  .f-ok{background:#E2F6E8;color:#14612F}
  .f-wait{background:#ECECEF;color:#555}
  .vis{display:flex;gap:12px;align-items:center;margin-bottom:10px}
  .vis img,.vis video{width:92px;height:92px;border-radius:12px;background:#ddd;object-fit:cover}
  .hint{font-size:12.5px;color:#666;margin-top:2px}
  code{font-size:11.5px;color:#555;word-break:break-all}
</style>
</head>
<body>
  <h1>Авто-діагностика анімації</h1>
  <div class="hint" style="margin-bottom:14px">Сторінка перевіряє сама. Нічого натискати не треба — зачекай ~3 секунди й надішли скріншот.</div>

  <div class="vis">
    <img id="g" src="diag.gif" alt="">
    <video id="v" src="diag.mp4" autoplay loop muted playsinline></video>
    <div class="hint">зліва GIF<br>справа MP4</div>
  </div>

  <div id="out"></div>
  <div id="final" class="final f-wait">Перевіряю…</div>

  <div class="r"><span class="k">Reduce Motion</span><span class="v" id="rm">—</span></div>
  <div class="r"><span class="k">Пристрій</span><span class="v" id="dev" style="font-size:11px;font-weight:600">—</span></div>

<script>
var out=document.getElementById('out'), fin=document.getElementById('final');
function row(k,v,cls){ out.insertAdjacentHTML('beforeend','<div class="r"><span class="k">'+k+'</span><span class="v '+cls+'">'+v+'</span></div>'); }

document.getElementById('rm').textContent =
  window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'УВІМКНЕНО' : 'вимкнено';
document.getElementById('rm').className = 'v ' +
  (window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'no' : 'yes');
document.getElementById('dev').textContent = (navigator.userAgent.match(/OS [\d_]+/)||['?'])[0].replace(/_/g,'.');

var img=document.getElementById('g'), vid=document.getElementById('v');
var cv=document.createElement('canvas'); cv.width=cv.height=60;
var cx=cv.getContext('2d',{willReadFrequently:true});

function snap(){
  try{ cx.drawImage(img,0,0,60,60); return cx.getImageData(0,0,60,60).data; }
  catch(e){ return null; }
}
function diff(a,b){ if(!a||!b) return -1; var d=0; for(var i=0;i<a.length;i+=4){ d+=Math.abs(a[i]-b[i]); } return d; }

var gifAnimates=null, vidPlays=null;

function finish(){
  if(gifAnimates===null||vidPlays===null) return;
  if(gifAnimates){
    fin.className='final f-ok';
    fin.innerHTML='✅ GIF анімується нормально.<br>Значить проблема саме в додатку — надішли цей скрін, копатиму далі.';
  } else if(vidPlays){
    fin.className='final f-code';
    fin.innerHTML='⚠️ GIF заморожені, але <b>відео грає</b>.<br>Це ліміт пам\'яті iOS на анімовані зображення. Перехід на MP4 у додатку має вирішити — надішли скрін.';
  } else {
    fin.className='final f-ios';
    fin.innerHTML='🔴 Не рухається <b>ніщо</b> — ні GIF, ні відео.<br>Це системне обмеження iOS, не код сторінки. Найчастіше: режим енергозбереження, екранний час/обмеження, або профіль керування пристроєм.';
  }
}

img.onload=function(){
  var a=snap();
  if(a===null){ row('GIF анімація','canvas заблоковано','wait'); gifAnimates=false; finish(); return; }
  setTimeout(function(){
    var b=snap(), d=diff(a,b);
    gifAnimates = d>300;
    row('GIF анімація', gifAnimates?'ПРАЦЮЄ':'ЗАМОРОЖЕНО', gifAnimates?'yes':'no');
    row('різниця кадрів', d<0?'—':String(d), 'wait');
    finish();
  },900);
};
img.onerror=function(){ row('GIF','не завантажився','no'); gifAnimates=false; finish(); };

vid.addEventListener('error',function(){ row('MP4','не підтримується','no'); vidPlays=false; finish(); });
setTimeout(function(){
  var t1=vid.currentTime;
  setTimeout(function(){
    if(vidPlays!==null) return;
    var t2=vid.currentTime;
    vidPlays = (t2>t1) && t2>0;
    row('Відео MP4', vidPlays?'ГРАЄ':'СТОЇТЬ', vidPlays?'yes':'no');
    row('час відео', t1.toFixed(2)+' → '+t2.toFixed(2), 'wait');
    finish();
  },900);
},700);
</script>
</body>
</html>
