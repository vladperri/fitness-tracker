<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0D">
<meta name="color-scheme" content="dark">
<title>Fitness Tracker</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../favicon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness">
<meta property="og:title" content="Fitness Tracker">
<meta property="og:description" content="Push · Pull · Legs — щоденний трекер">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0D;
    --card:#17171A;
    --card2:#212126;
    --line:rgba(255,255,255,.07);
    --line2:rgba(255,255,255,.12);
    --ink:#FFFFFF;
    --ink2:#C7C7CE;
    --muted:#86868F;
    --accent:#5FD3E6;
    --accent-dim:rgba(95,211,230,.13);
    --accent-deep:#2BB6CC;
    --ok:#4ED6A1;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  html,body{background:var(--bg);color:var(--ink)}
  body{
    font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    max-width:480px;margin:0 auto;
    padding:0 18px calc(34px + env(safe-area-inset-bottom));
    min-height:100dvh;
  }
  body.noscroll{overflow:hidden}
  h1,h2,h3,h4{font-weight:800;letter-spacing:-.01em}

  /* ── верхня панель ── */
  .topnav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 4px}
  .tn-link,.tn-btn{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:13px;font-weight:600;
    color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 15px;
    text-decoration:none;cursor:pointer;line-height:1;transition:.16s}
  .tn-link:active,.tn-btn:active{background:var(--card2);color:var(--accent)}
  @media (hover:hover){.tn-link:hover,.tn-btn:hover{color:var(--accent);border-color:var(--line2)}}

  /* ── шапка ── */
  header{padding:18px 0 16px;position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,var(--bg) 82%,rgba(11,11,13,0))}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .date{display:flex;align-items:baseline;gap:10px;margin-top:4px}
  .date .day{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .date .sub{font-size:14px;color:var(--muted);font-weight:600}

  /* ── тиждень ── */
  .cal{display:flex;align-items:center;gap:2px;margin-top:16px}
  .cal-nav{width:26px;height:46px;border-radius:9px;border:0;background:transparent;color:var(--muted);
    font-size:20px;cursor:pointer;line-height:1}
  .cal-days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-day{position:relative;border-radius:13px;padding:8px 0 9px;display:flex;flex-direction:column;
    align-items:center;gap:4px;cursor:pointer;background:var(--card);border:1px solid transparent;transition:.16s}
  .cal-day:active{background:var(--card2)}
  .cal-day .lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .cal-day .num{font-size:15px;font-weight:700;color:var(--ink2)}
  .cal-day.sel{background:var(--accent);border-color:var(--accent)}
  .cal-day.sel .lbl{color:rgba(11,11,13,.6)}
  .cal-day.sel .num{color:#0B0B0D}
  .cal-day .tdot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0}
  .cal-day.today .tdot{opacity:1}
  .cal-day.sel.today .tdot{background:#0B0B0D}

  /* ── секція-картка ── */
  section{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px;margin-bottom:14px}
  .sec-head{display:flex;align-items:center;gap:11px;margin-bottom:16px}
  .sec-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;
    background:var(--accent-dim);color:var(--accent)}
  .sec-ico svg{width:20px;height:20px}
  .sec-title{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1.3}
  .sec-title b{display:block;font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.01em;
    text-transform:none;margin-top:3px}

  /* ── дні програми ── */
  .wk{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;cursor:pointer;
    background:var(--card2);border:1px solid transparent;transition:.16s;user-select:none}
  .wk:active{background:#2A2A30}
  .wk + .wk{margin-top:8px}
  .wk.next{border-color:var(--accent);background:var(--accent-dim)}
  .wk-check{width:26px;height:26px;border-radius:9px;border:1.5px solid var(--line2);flex:none;
    display:grid;place-items:center;background:transparent;transition:.2s;padding:0;cursor:pointer}
  .wk-check svg{width:14px;height:14px;fill:none;stroke:#0B0B0D;stroke-width:3.2;stroke-linecap:round;
    stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .28s}
  .wk.done .wk-check{background:var(--accent);border-color:var(--accent)}
  .wk.done .wk-check svg{stroke-dashoffset:0}
  .wk-ico{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.05);flex:none;
    display:grid;place-items:center;color:var(--accent)}
  .wk-ico svg{width:21px;height:21px}
  .wk.next .wk-ico{background:rgba(95,211,230,.16)}
  .wk.done .wk-ico{color:var(--muted)}
  .wk-meta{flex:1;min-width:0}
  .wk-name{font-size:16.5px;font-weight:700;line-height:1.15;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    letter-spacing:-.01em}
  .wk.done .wk-name{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
  .wk-sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:3px;line-height:1.3}
  .wk-badge{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:#0B0B0D;background:var(--accent);padding:3px 7px;border-radius:999px;line-height:1}
  .wk-chev{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:rgba(255,255,255,.05);color:var(--ink2);font-size:17px;font-weight:400;line-height:1}
  .wk.next .wk-chev{background:var(--accent);color:#0B0B0D;font-weight:600}

  /* ── низ ── */
  footer{text-align:center;padding:4px 0 0}
  .reset{background:transparent;border:1px solid var(--line);color:var(--muted);font-family:inherit;
    font-size:13px;font-weight:600;padding:11px 20px;border-radius:999px;cursor:pointer;transition:.16s}
  .reset:active{background:var(--card);color:var(--ink2)}
  .auth-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;
    padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px}
  .auth-status{font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;line-height:1.3}
  .auth-btn{background:var(--accent);color:#0B0B0D;border:0;font-family:inherit;font-size:12.5px;font-weight:700;
    padding:9px 15px;border-radius:999px;cursor:pointer;flex:none}
  .note{font-size:11.5px;color:#5C5C64;margin-top:14px;line-height:1.5}

  /* ── модалка ── */
  .modal{position:fixed;inset:0;z-index:100;display:none}
  .modal.open{display:block}
  .mbg{position:absolute;inset:0;background:rgba(0,0,0,.72);opacity:0;transition:opacity .25s;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .modal.open .mbg{opacity:1}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(28px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
    max-width:480px;margin:0 auto;border-top:1px solid var(--line)}
  .modal.open .sheet{transform:none}
  .grabber{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:0 auto 14px}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}
  .sheet-title{font-size:21px;font-weight:800;letter-spacing:-.01em}
  .sheet-sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:4px}
  .close-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    color:var(--ink2);font-size:15px;cursor:pointer;flex:none;line-height:1}

  .ex-section{font-size:12.5px;font-weight:700;color:var(--ink2);letter-spacing:-.005em;
    margin:24px 0 11px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .ex-section:first-child{margin-top:0}

  .ex-card{display:flex;gap:13px;padding:13px;background:var(--card);border:1px solid var(--line);
    border-radius:18px;margin-bottom:9px}
  .ex-img{width:88px;height:88px;border-radius:14px;background:#fff;flex:none;display:grid;place-items:center;
    color:var(--accent-deep);padding:6px;overflow:hidden;position:relative}
  .ex-img svg{width:100%;height:100%}
  .ex-img .ex-sprite{position:absolute;inset:0;border-radius:14px;background-repeat:no-repeat;
    background-size:1056px 88px;background-position:0 0;background-color:#fff;
    animation:exrun 1.3s steps(12) infinite}
  @keyframes exrun{from{background-position:0 0}to{background-position:-1056px 0}}
  .ex-img .ex-pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff;
    border-radius:14px;opacity:0;transition:opacity .25s}
  .ex-img .ex-pic.ready{opacity:1}
  .ex-img .ex-pose-fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:6px}

  .ex-info{flex:1;min-width:0}
  .ex-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
  .ex-num{font-size:10.5px;font-weight:800;color:var(--accent);background:var(--accent-dim);
    padding:3px 7px;border-radius:7px;letter-spacing:.04em}
  .ex-name{font-size:15px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
  .ex-meta{font-size:13px;color:var(--accent);font-weight:700}
  .ex-weight{font-size:12px;color:var(--ink2);font-weight:600;margin-top:4px;
    background:rgba(255,255,255,.05);display:inline-block;padding:4px 9px;border-radius:8px}
  .ex-cue{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.45;font-weight:500}
  .demo-btn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:700;
    color:var(--accent);text-decoration:none;background:var(--accent-dim);padding:7px 12px;border-radius:999px}
  .demo-btn svg{width:13px;height:13px}
  .sheet-foot{font-size:11.5px;color:#5C5C64;text-align:center;margin-top:18px;line-height:1.5}

  /* ── кнопка старту в аркуші ── */
  .start-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    background:var(--accent);color:#0B0B0D;border:0;border-radius:16px;padding:16px;
    font-family:inherit;font-size:16px;font-weight:800;letter-spacing:-.01em;cursor:pointer;
    margin-bottom:20px}
  .start-btn:active{opacity:.85}
  .start-btn svg{width:17px;height:17px}
  .start-sub{font-size:12px;color:var(--muted);text-align:center;margin:-14px 0 20px;font-weight:500}

  /* ── повноекранний таймер ── */
  .tmr{position:fixed;inset:0;z-index:300;background:var(--bg);display:none;
    flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom))}
  .tmr.open{display:flex}
  .tmr.rest{background:#0A1416}

  .tmr-top{display:flex;align-items:center;gap:12px;flex:none}
  .tmr-x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    color:var(--ink2);font-size:15px;cursor:pointer;flex:none;line-height:1}
  .tmr-prog{flex:1;height:5px;border-radius:3px;background:var(--card2);overflow:hidden}
  .tmr-prog i{display:block;height:100%;background:var(--accent);width:0;border-radius:3px;transition:width .3s}
  .tmr-count{font-size:12px;font-weight:700;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}

  .tmr-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:4px;min-height:0;padding:10px 0}
  .tmr-phase{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  .tmr.rest .tmr-phase{color:#FFC861}
  .tmr-name{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:6px;
    max-width:320px}
  .tmr-meta{font-size:13.5px;color:var(--muted);font-weight:600;margin-top:5px}

  .tmr-ring{position:relative;width:min(250px,64vw);aspect-ratio:1;margin:14px 0 6px;flex:none}
  .tmr-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .tmr-ring circle{fill:none;stroke-width:9;stroke-linecap:round}
  .tmr-ring .trk{stroke:var(--card2)}
  .tmr-ring .bar{stroke:var(--accent);stroke-dasharray:691.15;stroke-dashoffset:0;
    transition:stroke-dashoffset .25s linear}
  .tmr.rest .tmr-ring .bar{stroke:#FFC861}
  .tmr-time{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;font-weight:800;
    letter-spacing:-.03em;font-variant-numeric:tabular-nums}

  .tmr-gif{width:104px;height:104px;border-radius:16px;background:#fff;position:relative;
    overflow:hidden;flex:none;margin-top:6px;display:none}
  .tmr-gif.on{display:block}
  .tmr-gif i{position:absolute;inset:0;background-repeat:no-repeat;
    background-size:1248px 104px;background-position:0 0;
    animation:exrun2 1.3s steps(12) infinite}
  @keyframes exrun2{from{background-position:0 0}to{background-position:-1248px 0}}
  .tmr-gif img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

  .tmr-eq{display:none;align-items:center;gap:8px;margin-top:10px;padding:10px 14px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:320px;
    font-size:13px;font-weight:600;color:var(--ink2);line-height:1.35;text-align:left}
  .tmr-eq.on{display:flex}
  .tmr-eq svg{width:16px;height:16px;flex:none;color:var(--accent)}

  .tmr-next{font-size:13px;color:var(--muted);font-weight:600;max-width:300px;line-height:1.4}
  .tmr-next b{color:var(--ink2);font-weight:700}

  .tmr-ctl{display:flex;gap:9px;flex:none}
  .tmr-btn{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink2);
    font-family:inherit;font-size:14px;font-weight:700;padding:15px 8px;border-radius:15px;cursor:pointer}
  .tmr-btn:active{background:var(--card2)}
  .tmr-btn.main{flex:1.3;background:var(--accent);color:#0B0B0D;border-color:var(--accent)}

  /* ── 3-2-1 ── */
  .tmr-go{position:absolute;inset:0;background:var(--bg);display:none;align-items:center;
    justify-content:center;z-index:5}
  .tmr-go.on{display:flex}
  .tmr-go-n{font-size:116px;font-weight:800;color:var(--accent);letter-spacing:-.04em;line-height:1;
    animation:pop .9s ease-out}
  .tmr-go-n.word{font-size:30px;letter-spacing:.06em;text-align:center;line-height:1.3;max-width:300px}
  @keyframes pop{0%{transform:scale(.55);opacity:0}35%{transform:scale(1);opacity:1}100%{opacity:1}}

  /* ── фініш ── */
  .tmr-done{text-align:center}
  .tmr-done .big{font-size:30px;font-weight:800;margin-bottom:8px}
  .tmr-done .sm{font-size:14px;color:var(--muted);font-weight:600;line-height:1.5}
</style>
</head>
<body>
<header>
  <div class="topnav">
    <a class="tn-link" href="../">‹ Меню</a>
    <button class="tn-btn" type="button" onclick="var u=location.href.split('?')[0].split('#')[0];location.replace(u+'?v='+Date.now())">↻ Оновити</button>
  </div>
    <div class="eyebrow" id="eyebrow">Сьогодні</div>
  <div class="date"><span class="day" id="dayName">—</span><span class="sub" id="dateSub"></span></div>
  <div class="cal">
    <button class="cal-nav" id="prevWk">‹</button>
    <div class="cal-days" id="calDays"></div>
    <button class="cal-nav" id="nextWk">›</button>
  </div>
</header>

<section>
  <div class="sec-head">
    <div class="sec-ico" id="moveIco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg></div>
    <div class="sec-title">Програма · через день<b id="activityTitle">Push · Pull · Legs</b></div>
  </div>
  <div id="activityTasks"></div>
</section>

<footer>
  <button class="reset" id="resetBtn">Скинути цей день</button>
  <div id="authBar" class="auth-bar"></div>
  <div class="note">Зберігається на пристрої · синхронізується з хмарою після входу.<br>Додай на головний екран для швидкого доступу.</div>
</footer>

<div class="modal" id="modal" aria-hidden="true">
  <div class="mbg" id="mbg"></div>
  <div class="sheet" role="dialog">
    <div class="grabber"></div>
    <div class="sheet-head">
      <div>
        <div class="sheet-title" id="sheetTitle">Тренування</div>
        <div class="sheet-sub" id="sheetSub"></div>
      </div>
      <button class="close-btn" id="closeBtn">✕</button>
    </div>
    <button class="start-btn" id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>Почати тренування</button>
    <div class="start-sub" id="startSub"></div>
    <div id="exList"></div>
    <p class="sheet-foot">Натисни «Дивитись демо» для відео на YouTube.<br>Стеж за технікою — зупинись, якщо щось болить.</p>
  </div>
</div>

<div class="tmr" id="tmr" aria-hidden="true">
  <div class="tmr-top">
    <button class="tmr-x" id="tmrX" aria-label="Закрити">✕</button>
    <div class="tmr-prog"><i id="tmrProg"></i></div>
    <div class="tmr-count" id="tmrCount">1 / 1</div>
  </div>
  <div class="tmr-body">
    <div class="tmr-phase" id="tmrPhase">—</div>
    <div class="tmr-name" id="tmrName">—</div>
    <div class="tmr-meta" id="tmrMeta"></div>
    <div class="tmr-gif" id="tmrGif"><i></i></div>
    <div class="tmr-ring">
      <svg viewBox="0 0 240 240"><circle class="trk" cx="120" cy="120" r="110"/><circle class="bar" id="tmrArc" cx="120" cy="120" r="110"/></svg>
      <div class="tmr-time" id="tmrTime">0:00</div>
    </div>
    <div class="tmr-next" id="tmrNext"></div>
    <div class="tmr-eq" id="tmrEq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg><span id="tmrEqT"></span></div>
  </div>
  <div class="tmr-ctl">
    <button class="tmr-btn" id="tmrPlus">+15 с</button>
    <button class="tmr-btn main" id="tmrPause">Пауза</button>
    <button class="tmr-btn" id="tmrSkip">Далі ›</button>
  </div>
  <div class="tmr-go" id="tmrGo"><div class="tmr-go-n" id="tmrGoN">3</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>

    var d=state.selectedDate;
    if(!state.entries[d]) state.entries[d]={activity:{},meals:{},water:0};
    return state.entries[d];
  }
  function save(){ saveRaw(JSON.stringify(state)); pushToCloud(); }

  var dNames=["Неділя","Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота"];
  var mNames=["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
  var dLetters=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
  var weekStart=mondayOf(new Date());
  var CHECK='<span class="check"><svg viewBox="0 0 18 18"><polyline points="3,9.5 7.5,14 15,4.5"/></svg></span>';

  function renderHeader(){
    var sel=parseD(state.selectedDate), isToday=state.selectedDate===todayStr(), h=new Date().getHours();
    document.getElementById("eyebrow").textContent = isToday?(h<12?"Доброго ранку":h<18?"Доброго дня":"Доброго вечора"):"План на";
    document.getElementById("dayName").textContent = dNames[sel.getDay()];
    document.getElementById("dateSub").textContent = sel.getDate()+" "+mNames[sel.getMonth()];
  }
  function renderCalendar(){
    var days=document.getElementById("calDays"), html="";
    for(var i=0;i<7;i++){
      var d=addDays(weekStart,i), ds=fmt(d);
      var cls="cal-day"+(ds===todayStr()?" today":"")+(ds===state.selectedDate?" sel":"");
      html+='<button class="'+cls+'" data-d="'+ds+'"><span class="lbl">'+dLetters[i]+'</span><span class="num">'+d.getDate()+'</span><span class="tdot"></span></button>';
    }
    days.innerHTML=html;
    days.querySelectorAll(".cal-day").forEach(function(b){
      b.addEventListener("click",function(){ state.selectedDate=b.getAttribute("data-d"); save(); renderAll(); });
    });
  }
  var SV = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
  var ICONS = {
    push:'<svg '+SV+'><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>',
    pull:'<svg '+SV+'><path d="M4 5h16M9 5v5M15 5v5M12 10v9M12 19l-3.2-3.2M12 19l3.2-3.2"/></svg>',
    legs:'<svg '+SV+'><path d="M13.5 3v5.6l-4 4.4 4 4.4V20M5.5 20h13"/></svg>'
  };
  function exCount(ex){ var n=0; ex.forEach(function(g){ n += g.items.length; }); return n; }
  var TICK = '<svg viewBox="0 0 18 18"><polyline points="3,9.5 7.5,14 15,4.5"/></svg>';

  function renderActivity(){
    var en = entry();
    var doneIdx = (en.wIdx != null) ? en.wIdx : -1;
    var nextIdx = (doneIdx >= 0) ? -1 : state.cycle;
    var html = "";

    ROTATION.forEach(function(w, i){
      var isDone = (i === doneIdx), isNext = (i === nextIdx);
      html += '<div class="wk'+(isDone?' done':'')+(isNext?' next':'')+'" data-i="'+i+'">';
      html +=   '<button class="wk-check" type="button" aria-label="Відмітити виконаним">'+TICK+'</button>';
      html +=   '<div class="wk-ico">'+(ICONS[w.icon]||'')+'</div>';
      html +=   '<div class="wk-meta">';
      html +=     '<div class="wk-name">'+w.title+(isNext?'<span class="wk-badge">наступне</span>':'')+'</div>';
      html +=     '<div class="wk-sub">'+w.groups+'</div>';
      html +=     '<div class="wk-sub">~'+Math.round(totalSec(w.ex)/60)+' хв · '+exCount(w.ex)+' вправ</div>';
      html +=   '</div>';
      html +=   '<div class="wk-chev">›</div>';
      html += '</div>';
    });

    var at = document.getElementById("activityTasks");
    at.innerHTML = html;

    at.querySelectorAll(".wk").forEach(function(el){
      var i = parseInt(el.getAttribute("data-i"), 10), w = ROTATION[i];
      el.querySelector(".wk-check").addEventListener("click", function(ev){
        ev.stopPropagation();
        var n = entry();
        if(n.wIdx === i){ state.cycle = i; delete n.wIdx; }
        else { n.wIdx = i; state.cycle = (i+1) % ROTATION.length; }
        save(); renderActivity(); renderCalendar();
      });
      el.addEventListener("click", function(){ openModal(w.exTitle, w.exSub, w.ex); });
    });
  }


  function renderAll(){ renderHeader(); renderCalendar(); renderActivity(); updateAuthUI(); }

  document.getElementById("prevWk").addEventListener("click",function(){ weekStart=addDays(weekStart,-7); renderCalendar(); });
  document.getElementById("nextWk").addEventListener("click",function(){ weekStart=addDays(weekStart,7); renderCalendar(); });
  document.getElementById("resetBtn").addEventListener("click",function(){
    if(confirm("Скинути всі відмітки за "+state.selectedDate+"?")){
      var prev=state.entries[state.selectedDate];
      if(prev && prev.wIdx!=null) state.cycle=prev.wIdx;
      state.entries[state.selectedDate]={activity:{},meals:{},water:0}; save(); renderAll();
    }
  });

  var modal=document.getElementById("modal");
  var PLAY='<svg viewBox="0 0 14 14"><polygon points="2,1 12,7 2,13"/></svg>';
  var curSections=null;
  function openModal(title,sub,sections){
    curSections=sections;
    document.getElementById("startSub").textContent="Повний прохід ≈ "+Math.round(totalSec(sections)/60)+" хв разом із відпочинком";
    document.getElementById("sheetTitle").textContent=title;
    document.getElementById("sheetSub").textContent=sub||"";
    var h="";
    sections.forEach(function(sec){
      if(sec.section){ h+='<div class="ex-section">'+sec.section+'</div>'; }
      sec.items.forEach(function(e,i){
        var pose=POSES[e.p]||POSES.squat;
        var yt="https://www.youtube.com/results?search_query="+encodeURIComponent(e.n+" вправа техніка");
        var img;
        if(e.img && e.img.sprite){
          img = '<div class="ex-sprite" style="background-image:url(\''+e.img.sprite+'\')"></div>';
        } else if(e.img && e.img.gif){
          img = '<div class="ex-pose-fb">'+pose+'</div><img class="ex-pic" src="'+e.img.gif+'" alt="" onload="this.classList.add(\'ready\')" onerror="this.remove()">';
        } else { img = pose; }
        h+='<div class="ex-card"><div class="ex-img">'+img+'</div><div class="ex-info">';
        h+='<div class="ex-row"><span class="ex-num">'+(i+1<10?"0":"")+(i+1)+'</span><span class="ex-name">'+e.n+'</span></div>';
        h+='<div class="ex-meta">'+e.r+'</div>';
        if(e.w){ h+='<div class="ex-weight">'+e.w+'</div>'; }
        h+='<div class="ex-cue">'+e.c+'</div>';
        h+='<a class="demo-btn" target="_blank" rel="noopener noreferrer" href="'+yt+'">'+PLAY+' Дивитись демо</a>';
        h+='</div></div>';
      });
    });
    document.getElementById("exList").innerHTML=h;

    // запуск усередині жесту користувача — обходить блокування автозапуску
    (function(){
      var vids = document.querySelectorAll('#exList video.ex-pic');
      for (var q=0; q<vids.length; q++){
        (function(vd){
          vd.muted = true;
          var pr = vd.play();
          if (pr && pr.catch) pr.catch(function(){
            vd.addEventListener('click', function(){ vd.play().catch(function(){}); });
            vd.closest('.ex-card') && vd.closest('.ex-card').addEventListener('click', function(){ vd.play().catch(function(){}); });
          });
        })(vids[q]);
      }
    })();

    modal.classList.add("open"); modal.setAttribute("aria-hidden","false");
    document.body.classList.add("noscroll");
  }
  function closeModal(){ modal.classList.remove("open"); modal.setAttribute("aria-hidden","true"); document.body.classList.remove("noscroll"); }
  document.getElementById("startBtn").addEventListener("click",function(){
    if(curSections){ closeModal(); tmrStart(curSections); }
  });
  document.getElementById("closeBtn").addEventListener("click",closeModal);
  document.getElementById("mbg").addEventListener("click",closeModal);
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&modal.classList.contains("open")) closeModal(); });




  // ══════════════════════════════════════════════════════════════
  //  ТАЙМЕР ТРЕНУВАННЯ
  // ══════════════════════════════════════════════════════════════

  // Відпочинок між підходами, секунди.
  // heavy — важка база зі штангою: найдовша пауза, інакше падає вага на наступному підході.
  // comp  — багатосуглобові на тренажері/гантелях.
  // iso   — ізоляція на одну групу, відновлюється швидко.
  var REST = { heavy:150, comp:120, iso60:60, iso75:75, circuit:10 };

  // Темп: скільки секунд займає один повтор (ексцентрика + концентрика).
  var TEMPO = { heavy:4, comp:4, iso60:3.5, iso75:3.5, uni:3 };

  var KIND = {
    "Barbell Bench Press":"heavy",
    "Barbell Romanian Deadlift":"heavy",
    "Incline DB Bench Press":"comp",
    "Shoulder Press Machine":"comp",
    "DB Seated Shoulder Press":"comp",
    "Lat Pulldown (close grip)":"comp",
    "Machine Seated Row":"comp",
    "Wide-Grip Lat Pulldown":"comp",
    "Face Pull":"iso60",
    "Calf Press (Leg Press)":"iso60",
    "Lying Leg Curl":"comp",
    "Pec Deck Fly":"iso75",
    "DB Lateral Raise":"iso60",
    "Cable Tricep Pushdown":"iso60",
    "Overhead Tricep Extension":"iso60",
    "Rear Delt Fly (Pec Deck)":"iso60",
    "DB Bicep Curl":"iso60",
    "DB Hammer Curl":"iso60",
    "Cable Kickback":"iso60"
  };


  // Що брати / куди йти — показується під час переходу до наступної вправи
  var EQUIP = {
    "Incline DB Bench Press":"Гантелі + лава під 30°",
    "Barbell Bench Press":"Штанга зі стійками + горизонтальна лава",
    "Shoulder Press Machine":"Тренажер жиму на плечі",
    "DB Lateral Raise":"Легкі гантелі",
    "Pec Deck Fly":"Пек-дек, ручки для зведення",
    "Cable Tricep Pushdown":"Верхній блок + канат",
    "Overhead Tricep Extension":"Верхній блок + канат, стати спиною",
    "Lat Pulldown (close grip)":"Верхній блок + вузька V-ручка",
    "Machine Seated Row":"Тренажер горизонтальної тяги",
    "Wide-Grip Lat Pulldown":"Верхній блок + довгий прямий гриф, широкий хват",
    "Face Pull":"Верхній блок на рівні обличчя + канат",
    "Calf Press (Leg Press)":"Жим ногами, носки на край платформи",
    "Rear Delt Fly (Pec Deck)":"Пек-дек, розвернути ручки назад",
    "DB Bicep Curl":"Гантелі",
    "DB Hammer Curl":"Гантелі, нейтральний хват",
    "Barbell Romanian Deadlift":"Штанга + стійки",
    "Lying Leg Curl":"Тренажер згинання ніг лежачи",
    "Cable Kickback":"Нижній блок + манжета на щиколотку",
    "DB Seated Shoulder Press":"Гантелі + лава зі спинкою",
    "Гребний Concept2":"Гребний тренажер",
    "Вигнута доріжка":"Бігова доріжка",
    "SkiErg":"SkiErg"
  };
  function equipOf(e){
    if(EQUIP[e.n]) return EQUIP[e.n];
    if(/секунд|кожен бік/.test(e.r||"")) return "Килимок";
    return "";
  }
  function setGif(e){
    var g = document.getElementById("tmrGif");
    var src = e && e.img && e.img.sprite;
    if(src){ g.innerHTML = '<i style="background-image:url(\''+src+'\')"></i>'; g.classList.add("on"); return; }
    if(e && e.img && e.img.gif){ g.innerHTML = '<img src="'+e.img.gif+'" alt="">'; g.classList.add("on"); return; }
    g.classList.remove("on"); g.innerHTML = '<i></i>';
  }

  function r5(n){ return Math.max(15, Math.round(n/5)*5); }

  // Перетворює рядок підходів ("4 × 8–10", "50 секунд", "10 хв") на план
  function planOf(e){
    var r = e.r || "", m;
    if(/хв/.test(r))                         return {type:"cardio",  sets:1, work:600, rest:0,  spec:r};
    if((m=r.match(/^(\d+)\s*секунд/)))       return {type:"circuit", sets:1, work:+m[1], rest:REST.circuit, spec:r};
    if((m=r.match(/^(\d+)\s*с\s*кожен/)))    return {type:"circuit", sets:1, work:+m[1]*2, rest:REST.circuit, spec:r};
    if((m=r.match(/^(\d+)\s*[×x]\s*(.+)$/))){
      var sets = +m[1], spec = m[2];
      var kind = KIND[e.n] || "iso60";
      var nums = spec.match(/\d+/g) || ["10"];
      var reps = +nums[nums.length-1];              // беремо верх діапазону
      var uni  = /кожн/.test(spec);                 // по черзі на кожну ногу/руку
      var work = uni ? r5(reps*TEMPO.uni)*2 : r5(reps*TEMPO[kind]);
      return {type:"set", sets:sets, work:work, rest:REST[kind], kind:kind, spec:spec};
    }
    return {type:"set", sets:1, work:45, rest:60, kind:"iso", spec:r};
  }

  // Пауза після останнього підходу вправи — довша, бо треба перейти й зібрати снаряд
  function gap(p){
    if(p.type==="circuit") return REST.circuit;
    if(p.type==="cardio")  return 0;
    return Math.min(p.rest + 30, 150);
  }

  function flatEx(sections){
    var out=[];
    sections.forEach(function(sec){
      sec.items.forEach(function(e){
        if(/альтернатива/i.test(e.n)) return;       // запасний варіант — не в потік
        out.push(e);
      });
    });
    return out;
  }

  // Будує послідовність фаз
  function buildPhases(sections){
    var list = flatEx(sections), ph=[];
    list.forEach(function(e, ei){
      var p = planOf(e), last = (ei === list.length-1);
      for(var s=1; s<=p.sets; s++){
        ph.push({kind:"work", e:e, p:p, set:s, dur:p.work, ei:ei});
        if(s < p.sets) ph.push({kind:"rest", dur:p.rest, ei:ei, e:e, p:p, set:s+1, to:"Підхід "+(s+1)});
      }
      if(!last){
        var g = gap(p);
        if(g>0) ph.push({kind:"rest", dur:g, ei:ei, to:list[ei+1].n, nextEx:list[ei+1], between:true});
      }
    });
    return {phases:ph, list:list};
  }

  function totalSec(sections){
    var b = buildPhases(sections), t=0;
    b.phases.forEach(function(x){ t += x.dur; });
    return t;
  }
  function mmss(s){ var m=Math.floor(s/60), x=s%60; return m+":"+(x<10?"0":"")+x; }

  // ── звук ──────────────────────────────────────────────────────
  var actx=null;
  function beep(freq, ms, vol){
    try{
      if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==="suspended") actx.resume();
      var o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(vol||0.14, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+ms/1000);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime+ms/1000);
    }catch(err){}
  }

  // ── екран блокування ──────────────────────────────────────────
  var wake=null;
  function wakeOn(){ try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(function(w){ wake=w; }).catch(function(){}); }catch(e){} }
  function wakeOff(){ try{ if(wake){ wake.release(); wake=null; } }catch(e){} }

  // ── двигун ────────────────────────────────────────────────────
  var T = { on:false, ph:[], i:0, left:0, total:0, elapsed:0, paused:false, tick:null, last:0 };
  var tmr = document.getElementById("tmr");
  var $ = function(id){ return document.getElementById(id); };
  var ARC = 691.15;

  function tmrPaint(){
    var p = T.ph[T.i]; if(!p) return;
    var rest = (p.kind === "rest");
    tmr.classList.toggle("rest", rest);

    var eq = document.getElementById("tmrEq");
    var show = p.e || null;          // чия гіфка на екрані

    if(!rest){
      $("tmrPhase").textContent = p.p.type === "set" ? "Підхід " + p.set + " / " + p.p.sets
                                : p.p.type === "cardio" ? "Кардіо" : "Вправа";
      $("tmrName").textContent = p.e.n;
      $("tmrMeta").textContent = p.p.spec + (p.e.w ? " · " + p.e.w : "");
      $("tmrNext").innerHTML = "";
      eq.classList.remove("on");
    } else if(p.between){
      show = p.nextEx;
      $("tmrPhase").textContent = "Перехід · далі";
      $("tmrName").textContent = p.nextEx.n;
      $("tmrMeta").textContent = (p.nextEx.r || "") + (p.nextEx.w ? " · " + p.nextEx.w : "");
      $("tmrNext").innerHTML = "";
      var txt = equipOf(p.nextEx);
      $("tmrEqT").textContent = txt;
      eq.classList.toggle("on", !!txt);
    } else {
      $("tmrPhase").textContent = "Відпочинок";
      $("tmrName").textContent = p.e.n;
      $("tmrMeta").textContent = p.p.spec + (p.e.w ? " · " + p.e.w : "");
      $("tmrNext").innerHTML = "Далі: <b>" + p.to + "</b>";
      eq.classList.remove("on");
    }

    if(T.gifOf !== show){ setGif(show); T.gifOf = show; }

    $("tmrTime").textContent = mmss(Math.ceil(T.left));
    $("tmrArc").style.strokeDashoffset = String(ARC * (1 - T.left / p.dur));
    $("tmrCount").textContent = (p.ei + (p.between ? 2 : 1)) + " / " + T.nEx;
    $("tmrProg").style.width = Math.min(100, T.elapsed / T.total * 100) + "%";
  }

  function tmrNext(auto){
    if(T.i >= T.ph.length - 1){ tmrFinish(); return; }
    T.i++;
    T.left = T.ph[T.i].dur;
    if(auto) beep(T.ph[T.i].kind === "work" ? 880 : 520, 200, .18);
    tmrPaint();
  }

  function tmrLoop(){
    var now = Date.now(), d = (now - T.last) / 1000; T.last = now;
    if(T.paused) return;
    var before = Math.ceil(T.left);
    T.left -= d; T.elapsed += d;
    var after = Math.ceil(T.left);
    if(after !== before && after > 0 && after <= 3) beep(660, 110, .12);
    if(T.left <= 0){ tmrNext(true); return; }
    tmrPaint();
  }

  function tmrStart(sections, title){
    var b = buildPhases(sections);
    if(!b.phases.length) return;
    T.ph = b.phases; T.nEx = b.list.length; T.i = 0; T.left = b.phases[0].dur;
    T.total = 0; b.phases.forEach(function(x){ T.total += x.dur; });
    T.elapsed = 0; T.paused = false; T.on = true; T.gifOf = undefined;
    $("tmrPause").textContent = "Пауза";
    tmr.classList.add("open"); tmr.setAttribute("aria-hidden","false");
    document.body.classList.add("noscroll");
    wakeOn();

    // 3 · 2 · 1 · поїхали
    var go = $("tmrGo"), gn = $("tmrGoN");
    go.classList.add("on");
    var seq = ["3","2","1","ТРЕНУВАННЯ<br>РОЗПОЧАТО"], k = 0;
    function step(){
      gn.className = "tmr-go-n" + (k === 3 ? " word" : "");
      gn.innerHTML = seq[k];
      gn.style.animation = "none"; void gn.offsetWidth; gn.style.animation = "";
      beep(k === 3 ? 980 : 700, k === 3 ? 320 : 130, .2);
      k++;
      if(k < seq.length){ setTimeout(step, 1000); }
      else setTimeout(function(){
        go.classList.remove("on");
        tmrPaint();
        T.last = Date.now();
        T.tick = setInterval(tmrLoop, 200);
      }, 900);
    }
    step();
  }

  function tmrStop(){
    if(T.tick){ clearInterval(T.tick); T.tick = null; }
    T.on = false;
    tmr.classList.remove("open","rest"); tmr.setAttribute("aria-hidden","true");
    $("tmrGo").classList.remove("on");
    document.body.classList.remove("noscroll");
    wakeOff();
  }

  function tmrFinish(){
    beep(880, 180, .2); setTimeout(function(){ beep(1175, 420, .2); }, 220);
    if(T.tick){ clearInterval(T.tick); T.tick = null; }
    $("tmrPhase").textContent = "Готово";
    $("tmrName").textContent = "Тренування завершено";
    $("tmrMeta").textContent = "Час у роботі: " + mmss(Math.round(T.total));
    $("tmrNext").innerHTML = "Відмітити цей день як виконаний можна на головному екрані.";
    $("tmrTime").textContent = "✓";
    document.getElementById("tmrGif").classList.remove("on");
    document.getElementById("tmrEq").classList.remove("on");
    $("tmrArc").style.strokeDashoffset = "0";
    $("tmrProg").style.width = "100%";
    T.on = false; wakeOff();
  }

  $("tmrX").addEventListener("click", tmrStop);
  $("tmrSkip").addEventListener("click", function(){ if(T.on) tmrNext(false); else tmrStop(); });
  $("tmrPlus").addEventListener("click", function(){ if(T.on){ T.left += 15; T.ph[T.i].dur += 15; tmrPaint(); } });
  $("tmrPause").addEventListener("click", function(){
    if(!T.on) return;
    T.paused = !T.paused;
    T.last = Date.now();
    $("tmrPause").textContent = T.paused ? "Продовжити" : "Пауза";
  });

  renderAll();
})();
</script>
