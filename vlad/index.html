<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16794A">
<meta name="color-scheme" content="light">
<title>Fitness Tracker</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../favicon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness">
<meta property="og:title" content="Fitness Tracker">
<meta property="og:description" content="Push · Pull · Legs — щоденний трекер">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1ECE2; --card:#FFFFFF; --ink:#17160F; --muted:#75736A;
    --line:rgba(23,22,15,.09);
    --accent:#16794A; --accent-deep:#0F5A37; --accent-soft:#E6F1EA;
    --water:#2B83C4; --water-soft:#E2EFF8;
    --shadow:0 1px 2px rgba(23,22,15,.04), 0 8px 24px rgba(23,22,15,.06);
    --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{color-scheme:light;background-color:#F1ECE2 !important}
  html,body{background-color:#F1ECE2 !important;color:#17160F !important;font-family:'Hanken Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
  @media (prefers-color-scheme: dark){
    html,body{background-color:#F1ECE2 !important;color:#17160F !important}
    section{background:#FFFFFF !important;color:#17160F !important}
    .opt{background:#fff !important;color:#17160F !important}
    .glass{background:#fff !important}
  }
  body{max-width:520px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom));
    background-image:radial-gradient(circle at 1px 1px, rgba(23,22,15,.04) 1px, transparent 0);background-size:22px 22px;}
  body.noscroll{overflow:hidden;height:100vh}
  h1,h2,h3,h4{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}

  header{padding:26px 4px 14px;position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#F1ECE2 78%,rgba(253,242,244,0))}

  .topnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .tn-link,.tn-btn{display:inline-flex;align-items:center;gap:5px;font-family:inherit;font-size:13px;font-weight:600;
    color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
    text-decoration:none;cursor:pointer;line-height:1;transition:.15s}
  .tn-link:active,.tn-btn:active{background:var(--accent-soft);color:var(--accent-deep);border-color:transparent}
  @media (hover:hover){.tn-link:hover,.tn-btn:hover{color:var(--accent-deep);border-color:var(--accent)}}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .date{display:flex;align-items:baseline;gap:10px;margin-top:2px}
  .date .day{font-size:32px;font-weight:800;line-height:1;font-family:'Bricolage Grotesque'}
  .date .sub{font-size:15px;color:var(--muted);font-weight:600}

  .cal{display:flex;align-items:center;gap:2px;margin-top:14px}
  .cal-nav{width:28px;height:46px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
  .cal-days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 9px;border-radius:11px;cursor:pointer;border:0;background:transparent;transition:.16s}
  .cal-day:active{transform:scale(.94)}
  .cal-day .lbl{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
  .cal-day .num{font-family:'Bricolage Grotesque';font-size:15px;font-weight:700;color:var(--ink);line-height:1}
  .cal-day .tdot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0}
  .cal-day.today .tdot{opacity:1}
  .cal-day.sel{background:var(--accent)}
  .cal-day.sel .lbl{color:rgba(255,255,255,.8)}
  .cal-day.sel .num{color:#fff}
  .cal-day.sel.today .tdot{background:#fff}

  .progress-wrap{margin-top:14px;display:flex;align-items:center;gap:12px}
  .bar{flex:1;height:8px;border-radius:99px;background:rgba(23,22,15,.08);overflow:hidden}
  .bar > i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-deep));transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .pct{font-size:13px;font-weight:700;color:var(--muted);min-width:46px;text-align:right;font-variant-numeric:tabular-nums}

  section{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:16px;
    opacity:0;transform:translateY(10px);animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards}
  section:nth-of-type(1){animation-delay:.05s}
  section:nth-of-type(2){animation-delay:.12s}
  section:nth-of-type(3){animation-delay:.19s}
  @keyframes rise{to{opacity:1;transform:none}}

  .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .sec-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none;background:var(--accent-soft)}
  .ico-water{background:var(--water-soft)}
  .sec-title{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);line-height:1.1}
  .sec-title b{display:block;font-family:'Bricolage Grotesque';font-size:19px;letter-spacing:-.01em;text-transform:none;color:var(--ink);font-weight:700;margin-top:2px}

  .task{display:flex;align-items:center;gap:13px;padding:12px;border-radius:14px;cursor:pointer;transition:background .2s;user-select:none}
  .task:active{background:rgba(23,22,15,.03)}
  .task + .task{margin-top:2px}
  .check{width:25px;height:25px;border-radius:8px;border:2px solid rgba(23,22,15,.18);flex:none;display:grid;place-items:center;transition:.22s;background:#fff}
  .check svg{width:14px;height:14px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .26s ease .04s}
  .task.done .check{background:var(--accent);border-color:var(--accent)}
  .task.done .check svg{stroke-dashoffset:0}
  .task .label{font-size:15.5px;font-weight:600;flex:1;line-height:1.25}
  .task.done .label{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(23,22,15,.25)}
  .chev{font-size:22px;color:var(--muted);line-height:1;font-weight:300;margin-left:4px}
  .task.has-detail .chev{color:var(--accent);font-weight:500}

  .meal{padding:6px 0}
  .meal + .meal{border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
  .meal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .meal-name{font-family:'Bricolage Grotesque';font-size:16px;font-weight:700}
  .meal-name .em{font-size:14px;margin-right:6px}
  .badge{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--accent-deep);background:var(--accent-soft);padding:4px 9px;border-radius:99px;opacity:0;transform:scale(.8);transition:.2s}
  .meal.picked .badge{opacity:1;transform:none}
  .opt{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1.5px solid var(--line);border-radius:13px;cursor:pointer;transition:.18s;margin-top:7px;background:#fff}
  .opt:active{transform:scale(.99)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(23,22,15,.2);flex:none;transition:.18s;position:relative}
  .opt.sel .dot{border-color:var(--accent);background:var(--accent)}
  .opt.sel .dot::after{content:"";position:absolute;inset:4px;background:#fff;border-radius:50%}
  .opt .o-name{flex:1;font-size:14.5px;font-weight:600;line-height:1.2}
  .opt .o-macros{font-size:11.5px;font-weight:700;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

  .macro-row{display:flex;gap:8px;margin-bottom:14px}
  .macro{flex:1;background:var(--accent-soft);border-radius:13px;padding:10px;text-align:center}
  .macro .mv{font-family:'Bricolage Grotesque';font-size:17px;font-weight:800;color:var(--accent-deep);line-height:1}
  .macro .ml{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}

  .water-top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
  .water-amt{font-family:'Bricolage Grotesque';font-size:38px;font-weight:800;line-height:.9;color:var(--water)}
  .water-amt small{font-size:17px;color:var(--muted);font-weight:700}
  .water-goal{font-size:13px;font-weight:700;color:var(--muted);text-align:right}
  .water-goal b{display:block;color:var(--ink);font-size:15px}
  .glasses{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:4px 0 16px}
  .glass{aspect-ratio:3/4;border-radius:9px 9px 11px 11px;border:2px solid var(--water-soft);background:#fff;position:relative;overflow:hidden;cursor:pointer;transition:transform .12s}
  .glass:active{transform:scale(.92)}
  .glass::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#A5CDE5,var(--water));transition:height .3s cubic-bezier(.2,.8,.2,1)}
  .glass.full{border-color:var(--water)}
  .glass.full::after{height:100%}
  .water-btns{display:flex;gap:10px}
  .wbtn{flex:1;padding:14px;border-radius:14px;border:0;font-family:'Bricolage Grotesque';font-size:15px;font-weight:700;cursor:pointer;transition:.16s}
  .wbtn:active{transform:scale(.97)}
  .wbtn.add{background:var(--water);color:#fff}
  .wbtn.sub{background:var(--water-soft);color:var(--water)}

  footer{text-align:center;margin-top:26px;padding-bottom:8px}
  .reset{background:none;border:0;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:8px}
  .note{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5;opacity:.85}
  .celebrate{color:var(--accent-deep);font-weight:800}
  .auth-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;padding:10px 4px}
  .auth-status{font-size:13px;color:var(--muted);font-weight:600;flex:1;line-height:1.3}
  .auth-btn{padding:8px 16px;border-radius:99px;border:1.5px solid var(--accent);color:var(--accent-deep);background:#fff;font-family:'Hanken Grotesk',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}

  .swipe-wrap{touch-action:pan-y}
  .swipe-wrap.anim{transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .22s}
  .cycle-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .cyc-nav{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--accent-deep);font-size:17px;font-weight:700;cursor:pointer;flex:none;line-height:1}
  .cyc-nav:disabled{opacity:.3}
  .cyc-dots{flex:1;display:flex;justify-content:center;gap:6px}
  .cyc-dot{width:8px;height:8px;border-radius:50%;background:rgba(23,22,15,.15);transition:.2s}
  .cyc-dot.on{background:var(--accent);transform:scale(1.35)}
  .cyc-hint{font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:10px;font-weight:600}
  .modal{position:fixed;inset:0;z-index:100;display:none}
  .modal.open{display:block}
  .mbg{position:absolute;inset:0;background:rgba(23,22,15,.5);opacity:0;transition:opacity .25s}
  .modal.open .mbg{opacity:1}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:26px 26px 0 0;
    max-height:92vh;overflow-y:auto;
    padding:22px 16px calc(34px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -10px 30px rgba(0,0,0,.18)}
  .modal.open .sheet{transform:none}
  .grabber{width:42px;height:5px;border-radius:99px;background:rgba(23,22,15,.18);margin:-8px auto 14px}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
  .sheet-title{font-family:'Bricolage Grotesque';font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .sheet-sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:3px}
  .close-btn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(23,22,15,.07);font-size:16px;font-weight:700;cursor:pointer;color:var(--ink);flex:none}
  .ex-section{font-family:'Bricolage Grotesque';font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-deep);padding:14px 4px 4px;margin-top:8px;border-bottom:1px solid var(--accent-soft);margin-bottom:4px;line-height:1.4}
  .ex-section:first-child{margin-top:0;padding-top:2px}
  .ex-card{display:flex;gap:12px;padding:13px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-top:10px;align-items:flex-start}
  .ex-img{width:88px;height:88px;border-radius:14px;background:var(--accent-soft);flex:none;display:grid;place-items:center;color:var(--accent-deep);padding:6px;overflow:hidden;position:relative}
  .ex-img svg{width:100%;height:100%}

  .ex-img .ex-sprite{position:absolute;inset:0;border-radius:14px;background-repeat:no-repeat;
    background-size:1056px 88px;background-position:0 0;background-color:#fff;
    animation:exrun 1.3s steps(12) infinite}
  @keyframes exrun{from{background-position:0 0}to{background-position:-1056px 0}}}
  .ex-img .ex-pic{object-fit:cover;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff;border-radius:14px;opacity:0;transition:opacity .25s}
  .ex-img .ex-pic.ready{opacity:1}
  .ex-img .ex-pose-fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:6px}
  .ex-info{flex:1;min-width:0}
  .ex-row{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
  .ex-num{font-family:'Bricolage Grotesque';font-size:11px;font-weight:800;color:var(--accent-deep);background:var(--accent-soft);padding:2px 7px;border-radius:6px}
  .ex-name{font-family:'Bricolage Grotesque';font-size:15.5px;font-weight:700;line-height:1.2}
  .ex-meta{font-size:13px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:5px}
  .ex-weight{display:inline-block;background:var(--accent-soft);color:var(--accent-deep);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:8px;margin-bottom:7px}
  .ex-cue{font-size:12.5px;color:var(--muted);line-height:1.45;margin-bottom:8px}
  .demo-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--accent);color:var(--accent-deep);font-size:12px;font-weight:700;text-decoration:none}
  .demo-btn svg{width:11px;height:11px;fill:currentColor}
  .sheet-foot{font-size:11.5px;color:var(--muted);margin-top:16px;text-align:center;line-height:1.5;padding:0 10px}
</style>
</head>
<body>
<header>
  <div class="topnav">
    <a class="tn-link" href="../">‹ Меню</a>
    <button class="tn-btn" type="button" onclick="var u=location.href.split('?')[0].split('#')[0];location.replace(u+'?v='+Date.now())">↻ Оновити</button>
  </div>
    <div class="eyebrow" id="eyebrow">Сьогодні</div>
  <div class="date"><span class="day" id="dayName">—</span><span class="sub" id="dateSub"></span></div>
  <div class="cal">
    <button class="cal-nav" id="prevWk">‹</button>
    <div class="cal-days" id="calDays"></div>
    <button class="cal-nav" id="nextWk">›</button>
  </div>
</header>

<section>
  <div class="sec-head">
    <div class="sec-ico" id="moveIco">💪</div>
    <div class="sec-title">Рух<b id="activityTitle">—</b></div>
  </div>
  <div id="activityTasks"></div>
</section>

<footer>
  <button class="reset" id="resetBtn">Скинути цей день</button>
  <div id="authBar" class="auth-bar"></div>
  <div class="note">Зберігається на пристрої · синхронізується з хмарою після входу.<br>Додай на головний екран для швидкого доступу.</div>
</footer>

<div class="modal" id="modal" aria-hidden="true">
  <div class="mbg" id="mbg"></div>
  <div class="sheet" role="dialog">
    <div class="grabber"></div>
    <div class="sheet-head">
      <div>
        <div class="sheet-title" id="sheetTitle">Тренування</div>
        <div class="sheet-sub" id="sheetSub"></div>
      </div>
      <button class="close-btn" id="closeBtn">✕</button>
    </div>
    <div id="exList"></div>
    <p class="sheet-foot">Натисни «Дивитись демо» для відео на YouTube.<br>Стеж за технікою — зупинись, якщо щось болить.</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  function pushToCloud(){ var d=cloudDoc(); if(d) d.set({entries:state.entries},{merge:true}).catch(function(){}); }
  function syncFromCloud(){
    var d=cloudDoc(); if(!d) return;
    d.get().then(function(s){
      var cl = s.exists?(s.data().entries||{}):{};
      state.entries = Object.assign({}, cl, state.entries);
      saveRaw(JSON.stringify(state)); renderAll();
      if(!s.exists) pushToCloud();

  function todayStr(){ return fmt(new Date()); }
  function parseD(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
  function mondayOf(d){ var x=new Date(d); x.setHours(0,0,0,0); var off=(x.getDay()+6)%7; x.setDate(x.getDate()-off); return x; }
  function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }

  var KEY="vladTracker_v2", mem=null;
  function loadRaw(){ try{ return localStorage.getItem(KEY); }catch(e){ return mem; } }
  function saveRaw(s){ try{ localStorage.setItem(KEY,s); }catch(e){ mem=s; } }
  var state=(function(){ var r=loadRaw(); if(r){ try{ return JSON.parse(r); }catch(e){} } return {entries:{},cycle:0}; })();
  if(!state.entries) state.entries={};
  if(typeof state.cycle!=="number") state.cycle=0;
  state.selectedDate=todayStr();
  function entry(){
    var d=state.selectedDate;
    if(!state.entries[d]) state.entries[d]={activity:{},meals:{},water:0};
    return state.entries[d];
  }
  function save(){ saveRaw(JSON.stringify(state)); pushToCloud(); }

  var dNames=["Неділя","Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота"];
  var mNames=["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
  var dLetters=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
  var weekStart=mondayOf(new Date());
  var swipeGuard = 0;
  var CHECK='<span class="check"><svg viewBox="0 0 18 18"><polyline points="3,9.5 7.5,14 15,4.5"/></svg></span>';

  function renderHeader(){
    var sel=parseD(state.selectedDate), isToday=state.selectedDate===todayStr(), h=new Date().getHours();
    document.getElementById("eyebrow").textContent = isToday?(h<12?"Доброго ранку":h<18?"Доброго дня":"Доброго вечора"):"План на";
    document.getElementById("dayName").textContent = dNames[sel.getDay()];
    document.getElementById("dateSub").textContent = sel.getDate()+" "+mNames[sel.getMonth()];
  }
  function renderCalendar(){
    var days=document.getElementById("calDays"), html="";
    for(var i=0;i<7;i++){
      var d=addDays(weekStart,i), ds=fmt(d);
      var cls="cal-day"+(ds===todayStr()?" today":"")+(ds===state.selectedDate?" sel":"");
      html+='<button class="'+cls+'" data-d="'+ds+'"><span class="lbl">'+dLetters[i]+'</span><span class="num">'+d.getDate()+'</span><span class="tdot"></span></button>';
    }
    days.innerHTML=html;
    days.querySelectorAll(".cal-day").forEach(function(b){
      b.addEventListener("click",function(){ state.selectedDate=b.getAttribute("data-d"); save(); renderAll(); });
    });
  }
  function renderActivity(){
    var en = entry();
    var done = (en.wIdx != null);
    var idx  = done ? en.wIdx : state.cycle;
    var w    = ROTATION[idx];

    document.getElementById("activityTitle").textContent = w.title;
    document.getElementById("moveIco").textContent = w.emoji;

    var html = "";
    if(!done){
      html += '<div class="cycle-bar">';
      html +=   '<button class="cyc-nav" id="cycPrev">‹</button>';
      html +=   '<div class="cyc-dots">';
      for(var k=0;k<ROTATION.length;k++){ html += '<span class="cyc-dot'+(k===idx?' on':'')+'"></span>'; }
      html +=   '</div>';
      html +=   '<button class="cyc-nav" id="cycNext">›</button>';
      html += '</div>';
      html += '<div class="cyc-hint">Наступне за циклом · свайп або стрілки</div>';
    }

    html += '<div class="task'+(done?" done":"")+' has-detail" data-task="workout">'+CHECK+
            '<span class="label">'+w.title+' · '+w.dur+'</span><span class="chev">›</span></div>';

    var at = document.getElementById("activityTasks");
    at.innerHTML = html;

    var pv = document.getElementById("cycPrev"), nx = document.getElementById("cycNext");
    if(pv) pv.addEventListener("click", function(){ state.cycle=(state.cycle+ROTATION.length-1)%ROTATION.length; save(); renderActivity(); });
    if(nx) nx.addEventListener("click", function(){ state.cycle=(state.cycle+1)%ROTATION.length; save(); renderActivity(); });

    at.querySelectorAll(".task").forEach(function(el){
      var id = el.getAttribute("data-task");
      el.querySelector(".check").addEventListener("click", function(ev){
        ev.stopPropagation();
        var n = entry();
        if(id === "workout"){
          if(n.wIdx != null){ state.cycle = n.wIdx; delete n.wIdx; }
          else { n.wIdx = state.cycle; state.cycle = (state.cycle+1)%ROTATION.length; }
        } else {
          n.activity[id] = !n.activity[id];
        }
        save(); renderActivity();
      });
      el.addEventListener("click", function(){
        if(Date.now()-swipeGuard < 450) return;
        if(id === "workout"){ openModal(w.exTitle, w.exSub, w.ex); }
        else { var n=entry(); n.activity[id]=!n.activity[id]; save(); renderActivity(); }
      });
    });


  }


  function renderAll(){ renderHeader(); renderCalendar(); renderActivity(); updateAuthUI(); }

  document.getElementById("prevWk").addEventListener("click",function(){ weekStart=addDays(weekStart,-7); renderCalendar(); });
  document.getElementById("nextWk").addEventListener("click",function(){ weekStart=addDays(weekStart,7); renderCalendar(); });
  document.getElementById("resetBtn").addEventListener("click",function(){
    if(confirm("Скинути всі відмітки за "+state.selectedDate+"?")){
      var prev=state.entries[state.selectedDate];
      if(prev && prev.wIdx!=null) state.cycle=prev.wIdx;
      state.entries[state.selectedDate]={activity:{},meals:{},water:0}; save(); renderAll();
    }
  });

  var modal=document.getElementById("modal");
  var PLAY='<svg viewBox="0 0 14 14"><polygon points="2,1 12,7 2,13"/></svg>';
  function openModal(title,sub,sections){
    document.getElementById("sheetTitle").textContent=title;
    document.getElementById("sheetSub").textContent=sub||"";
    var h="";
    sections.forEach(function(sec){
      if(sec.section){ h+='<div class="ex-section">'+sec.section+'</div>'; }
      sec.items.forEach(function(e,i){
        var pose=POSES[e.p]||POSES.squat;
        var yt="https://www.youtube.com/results?search_query="+encodeURIComponent(e.n+" вправа техніка");
        var img;
        if(e.img && e.img.sprite){
          img = '<div class="ex-sprite" style="background-image:url(\''+e.img.sprite+'\')"></div>';
        } else if(e.img && e.img.gif){
          img = '<div class="ex-pose-fb">'+pose+'</div><img class="ex-pic" src="'+e.img.gif+'" alt="" onload="this.classList.add(\'ready\')" onerror="this.remove()">';
        } else { img = pose; }
        h+='<div class="ex-card"><div class="ex-img">'+img+'</div><div class="ex-info">';
        h+='<div class="ex-row"><span class="ex-num">'+(i+1<10?"0":"")+(i+1)+'</span><span class="ex-name">'+e.n+'</span></div>';
        h+='<div class="ex-meta">'+e.r+'</div>';
        if(e.w){ h+='<div class="ex-weight">🏋️ '+e.w+'</div>'; }
        h+='<div class="ex-cue">'+e.c+'</div>';
        h+='<a class="demo-btn" target="_blank" rel="noopener noreferrer" href="'+yt+'">'+PLAY+' Дивитись демо</a>';
        h+='</div></div>';
      });
    });
    document.getElementById("exList").innerHTML=h;

    // запуск усередині жесту користувача — обходить блокування автозапуску
    (function(){
      var vids = document.querySelectorAll('#exList video.ex-pic');
      for (var q=0; q<vids.length; q++){
        (function(vd){
          vd.muted = true;
          var pr = vd.play();
          if (pr && pr.catch) pr.catch(function(){
            vd.addEventListener('click', function(){ vd.play().catch(function(){}); });
            vd.closest('.ex-card') && vd.closest('.ex-card').addEventListener('click', function(){ vd.play().catch(function(){}); });
          });
        })(vids[q]);
      }
    })();

    modal.classList.add("open"); modal.setAttribute("aria-hidden","false");
    document.body.classList.add("noscroll");
  }
  function closeModal(){ modal.classList.remove("open"); modal.setAttribute("aria-hidden","true"); document.body.classList.remove("noscroll"); }
  document.getElementById("closeBtn").addEventListener("click",closeModal);
  document.getElementById("mbg").addEventListener("click",closeModal);
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&modal.classList.contains("open")) closeModal(); });


  // ── свайп для зміни тренування (ініціалізується один раз) ──────────
  (function initSwipe(){
    var at = document.getElementById("activityTasks");
    if(!at) return;
    at.classList.add('swipe-wrap');
    var x0=null, y0=null, dragging=false;
    function reset(){ at.style.transform=''; at.style.opacity=''; }

    at.addEventListener('touchstart', function(ev){
      if(entry().wIdx != null){ x0=null; return; }
      var t=ev.changedTouches[0]; x0=t.clientX; y0=t.clientY; dragging=false;
      at.classList.remove('anim');
    }, {passive:true});

    at.addEventListener('touchmove', function(ev){
      if(x0===null) return;
      var t=ev.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
      if(!dragging && Math.abs(dx) > Math.abs(dy)*1.3 && Math.abs(dx) > 10) dragging=true;
      if(dragging){
        at.style.transform='translateX('+(dx*0.35)+'px)';
        at.style.opacity=String(Math.max(0.45, 1-Math.abs(dx)/320));
      }
    }, {passive:true});

    at.addEventListener('touchend', function(ev){
      if(x0===null) return;
      var t=ev.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
      x0=null;
      at.classList.add('anim');
      if(dragging && Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.3){
        swipeGuard = Date.now();
        state.cycle = (state.cycle + (dx<0 ? 1 : ROTATION.length-1)) % ROTATION.length;
        at.style.transform='translateX('+(dx<0?-60:60)+'px)';
        at.style.opacity='0';
        setTimeout(function(){ save(); renderActivity(); reset(); }, 150);
      } else { reset(); }
      dragging=false;
    }, {passive:true});
  })();

  renderAll();
})();
</script>
</body>
</html>
